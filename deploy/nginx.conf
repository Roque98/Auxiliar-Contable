# Sitio nginx de la consola ZIA en ziacentro.mx (dominio propio, DNS en Cloudflare, nube gris).
#   console.ziacentro.mx -> Angular (/srv/zia-console/current/web)
#   api.ziacentro.mx     -> API (systemd zia-console, 127.0.0.1:5010)
# Certificado: certbot certonly --webroot -w /var/www/acme -d ziacentro.mx -d www.ziacentro.mx
#   -d console.ziacentro.mx -d api.ziacentro.mx   (renovacion automatica por certbot.timer)

# Vacío -> keep-alive (casi toda la API). Con Upgrade -> WebSocket (p. ej. SignalR).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      keep-alive;
}

# --- API -----------------------------------------------------------------------
server {
    server_name api.ziacentro.mx;
    include /etc/nginx/snippets/cloudflare-realip.conf;  # IP real del visitante (CF-Connecting-IP)
    include /etc/nginx/snippets/cloudflare-solo.conf;    # solo trafico desde Cloudflare

    # HSTS. Inerte mientras el sitio sea HTTP (los navegadores lo ignoran fuera de
    # HTTPS) y efectivo en cuanto certbot convierta este bloque a 443, que es lo que
    # permite versionarlo aqui sin romper el arranque inicial.
    #
    # OJO, ES UN COMPROMISO: durante un ano el navegador de quien ya visito el sitio
    # se NEGARA a hablar por HTTP con este dominio. Si el certificado caduca o se
    # rompe TLS, para esa gente el sitio queda inaccesible, no degradado a HTTP.
    # Sin 'preload' a proposito: entrar en la lista precargada de los navegadores es
    # practicamente irreversible y no se hace desde aqui.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Por ENCIMA del limite que aplica la aplicacion (1 MB de imagen, ver
    # ProfilePictureConsts.MaxBytes), no por debajo ni igual.
    #
    # El defecto de nginx es 1 MB y corta ANTES de que la peticion llegue a la app: quien
    # subiera una foto justo en el limite recibia un 413 con la pagina de error de nginx en
    # vez del mensaje de la aplicacion ("la imagen pesa mas de 1024 KB"). Y ojo, el cuerpo
    # multipart pesa algo mas que el archivo (frontera + cabeceras), asi que una imagen
    # legitima de 1 MB exacto ya se pasaba. Comprobado contra produccion: 1,5 MB -> 413 de
    # nginx; 500 KB -> llega a la app.
    #
    # Dejando holgura aqui, el que rechaza y explica es siempre la aplicacion. Esto NO
    # relaja el limite real: el tope de bytes al leer sigue siendo el de la app.
    client_max_body_size 2m;

    location / {
        proxy_pass         http://127.0.0.1:5010;
        proxy_http_version 1.1;

        # Sin X-Forwarded-Proto la app se cree en http y OpenIddict emite URLs con el
        # esquema equivocado -> el login entra en bucle de redirecciones.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Subida de JSON de controles volumétricos: un mensual de una estación grande (miles de
    # CFDI de venta) pasa con holgura de los 2 MB de arriba. Solo ESTA ruta sube el tope; la
    # app vuelve a limitar al leer (VolumetricosConsts.MaxBytesArchivo = 30 MB).
    location = /api/app/auditoria-volumetrica/subir {
        client_max_body_size 32m;
        proxy_pass         http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # El respaldo diario de cada nodo de estacion (su base comprimida, NodoConsts.MaxBytesDeRespaldo).
    location = /api/nodo/respaldo {
        client_max_body_size 64m;
        proxy_pass         http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location = /health-status {
        proxy_pass http://127.0.0.1:5010;
        proxy_set_header Host $host;
        access_log off;
    }

    # Swagger documenta toda la API: no se publica en produccion.
    location /swagger {
        return 404;
    }

    # El panel de health checks expone informacion interna.
    location /health-ui {
        deny all;
    }


}

# --- Frontend Angular ----------------------------------------------------------
server {
    server_name console.ziacentro.mx;
    include /etc/nginx/snippets/cloudflare-realip.conf;  # IP real del visitante (CF-Connecting-IP)
    include /etc/nginx/snippets/cloudflare-solo.conf;    # solo trafico desde Cloudflare

    # Ver la nota sobre HSTS del bloque de la API.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root  /srv/zia-console/current/web;
    index index.html;

    # SPA: una ruta desconocida la resuelve el router de Angular, no un 404 de nginx.
    # Asistente ZIA embebido en la consola: mismo servicio que la landing (zia-chatbot,
    # 127.0.0.1:5020). Same-origin, sin CORS. Requiere conf.d/zia-chat-limits.conf.
    include /etc/nginx/snippets/zia-chat.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # OJO con los add_header de aqui abajo: en nginx, un add_header dentro de un
    # location DESCARTA todos los heredados del server. Por eso el HSTS se repite en
    # cada location que anade cabeceras propias — si no, justo index.html (la pagina
    # que abre todo el mundo) se quedaria sin el.

    # Nada que empiece por punto (.git, .env) se sirve, salvo el reto de certbot. Sin
    # esto el fallback de la SPA contesta 200 con index.html y los escaneres insisten.
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Los bundles llevan hash en el nombre: cachearlos un ano es seguro.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # index.html NUNCA se cachea: es quien apunta a los bundles nuevos tras un deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;


}

# --- HTTP: reto ACME y salto a HTTPS -------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name console.ziacentro.mx api.ziacentro.mx;
    include /etc/nginx/snippets/cloudflare-realip.conf;  # IP real del visitante (CF-Connecting-IP)
    include /etc/nginx/snippets/cloudflare-solo.conf;    # solo trafico desde Cloudflare
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}
