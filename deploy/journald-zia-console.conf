# Retención del journal del sistema.
#
# Se instala como /etc/systemd/journald.conf.d/zia-console.conf y luego
#   systemctl restart systemd-journald
#
# ⚠️ POR QUÉ EXISTE. `journald` ya guardaba en disco (hay /var/log/journal, así que el
# historial sobrevive a los reinicios) pero SIN NINGUNA configuración: todo por defecto.
# Y los valores por defecto son solo por tamaño — `SystemMaxUse` es el 10 % del sistema de
# archivos, aquí unos 9,6 GB — y **sin ningún límite de tiempo**.
#
# Lo que eso significa en la práctica no es que se llene el disco, sino algo más tonto: la
# ventana de historial que tienes depende de cuánto ruido haya hecho la máquina, y no la
# sabes. Un día con una tormenta de errores puede tragarse las semanas anteriores sin que
# nada avise. La pregunta que se quiere poder contestar es «¿qué pasó hace tres semanas?»,
# y para eso hace falta un límite POR TIEMPO, que es lo que faltaba.
#
# Medido en el servidor antes de esto: 307 MB en 4 días de vida, unos 75 MB/día. Con el
# tope de abajo caben de sobra los 30 días.

[Journal]
# Que el historial sobreviva a los reinicios. Ya era el caso porque /var/log/journal existe,
# pero declarado es una decisión y no una casualidad del sistema de archivos.
Storage=persistent

# El límite que de verdad importa: 30 días. Es lo que hace falta para poder mirar atrás tres
# semanas con margen.
MaxRetentionSec=30day

# Techo por tamaño, como cortafuegos. 3 GB sobre 96 GB de disco es holgado para 30 días a
# 75 MB/día (unos 2,2 GB) y deja sitio si el volumen sube. Sin este tope, una tormenta de
# errores podría llegar al 10 % por defecto y competir con la base de datos por el disco.
SystemMaxUse=3G

# Cada archivo, manejable. Sin esto journald elige el tamaño solo y pueden salir ficheros
# incómodos de copiar o inspeccionar.
SystemMaxFileSize=200M

# Cortar ráfagas de un mismo servicio. Un bucle de errores puede escribir miles de líneas
# por segundo y, sin freno, expulsa del journal todo lo demás que estaba pasando a la vez
# —incluida la causa—. Con esto se pierden líneas repetidas y se conserva el contexto;
# journald deja constancia de cuántas descartó.
RateLimitIntervalSec=30s
RateLimitBurst=10000
