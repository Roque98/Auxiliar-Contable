name: Vigilancia

# Comprobación externa de producción cada 15 minutos, desde fuera del VPS: si el servidor,
# nginx, Cloudflare o la API se caen, lo que vigila desde dentro (health checks, avisos por
# Telegram) se cae con ellos. Si falla, GitHub manda un correo a quien hizo el último cambio
# del cron (Settings > Notifications > Actions: «Send notifications for failed workflows only»).
#
# ⚠️ GitHub DESACTIVA los workflows programados tras 60 días sin actividad en el repositorio.
# Si el repo se queda quieto tanto tiempo, reactivarlo en Actions > Vigilancia.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: La web responde y es Auxiliar contable
        run: |
          # Reintentos cortos: un parpadeo de red no es una caída.
          html=$(curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 20 https://contable.ziacentro.mx/)
          echo "$html" | grep -q "<title>Auxiliar contable" || { echo "::error::La web no devuelve la app (¿otro sitio?, ¿página de error de Cloudflare?)"; exit 1; }

      - name: La API está sana
        run: |
          salud=$(curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 20 https://api-contable.ziacentro.mx/health-status)
          echo "$salud" | head -c 2000; echo
          estado=$(echo "$salud" | jq -r '.status')
          # Degraded = algo que revisar sin que la app esté caída (p. ej. la copia no salió del
          # servidor): aviso, no fallo, para no mandar un correo cada 15 minutos por lo mismo.
          # El detalle de qué está degradado sale en el JSON de arriba.
          case "$estado" in
            Healthy) ;;
            Degraded) echo "::warning::La API responde Degraded: $(echo "$salud" | jq -r '[.entries | to_entries[] | select(.value.status != "Healthy") | "\(.key): \(.value.description)"] | join("; ")')" ;;
            *) echo "::error::La API responde '$estado'"; exit 1 ;;
          esac
