<div class="fp-root">
  <app-cabecera [titulo]="'::Menu:ProfilePicture' | abpLocalization"
                [descripcion]="'::ProfilePicture:Intro' | abpLocalization: ladoMaximoTexto" />

  <app-esqueleto *ngIf="cargando" [filas]="5" [etiqueta]="'::Common:Loading' | abpLocalization" />

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <div *ngIf="aviso" class="alert alert-success">{{ aviso }}</div>

  <div *ngIf="!cargando" class="tarjeta">
    <div class="previsualizacion">
      <img *ngIf="foto" [src]="foto" alt="Tu foto de perfil" class="foto" />
      <div *ngIf="!foto" class="sin-foto" aria-hidden="true">
        <i class="fas fa-user"></i>
      </div>
    </div>

    <div class="acciones">
      <!-- El input va oculto y se dispara desde el label: el control nativo de archivo no
           se puede estilar y queda fuera de sitio junto a los botones de Bootstrap. -->
      <label class="btn btn-primary" [class.disabled]="subiendo">
        <!-- ⚠️ Se resuelve en el componente y no aquí: un ternario de plantilla no admite
             el pipe de localización (§6.95). Estaba en español fijo y salía tal cual dentro
             de la interfaz en inglés. -->
        {{ textoDelBoton }}
        <input
          type="file"
          accept="image/*"
          class="oculto"
          [disabled]="subiendo"
          (change)="elegir($event)" />
      </label>

      <button
        *ngIf="foto"
        type="button"
        class="btn btn-outline-danger"
        [disabled]="subiendo"
        (click)="quitar()">{{ '::ProfilePicture:Remove' | abpLocalization }}</button>
    </div>

    <p class="ayuda">{{ '::ProfilePicture:Hint' | abpLocalization }}</p>
  </div>
</div>
